<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login | URL Shortener</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <h1>Welcome Back</h1>
        <p class="subtitle">Login to manage your shortened URLs</p>

		<form th:action="@{/login}" method="post" onsubmit="return validateLoginForm()">
		    <div class="form-group">
		        <label for="email">Email</label>
		        <input type="email" id="email" name="username" placeholder="Enter your email">
		        <small id="emailError"></small>
		    </div>

		    <div class="form-group">
		        <label for="password">Password</label>
		        <div class="password-box">
		            <input type="password" id="password" name="password" placeholder="Enter your password">
		            <button type="button" onclick="togglePassword('password')">Show</button>
		        </div>
		        <small id="passwordError"></small>
		    </div>

		    <button type="submit" class="btn-primary">Login</button>
		</form>

        <p class="bottom-text">
            Don’t have an account?
            <a th:href="@{/signup}">Create account</a>
        </p>
    </div>
</div>

<script th:src="@{/js/auth.js}"></script>
</body>
</html>
