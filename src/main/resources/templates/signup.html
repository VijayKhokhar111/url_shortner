<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | URL Shortener</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <h1>Create Account</h1>
        <p class="subtitle">Sign up to start shortening your URLs</p>

        <form th:action="@{/req/signup}" method="post" onsubmit="return validateSignupForm()">
			            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name">
                <small id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail" name="username" placeholder="Enter your email">
                <small id="signupEmailError"></small>
            </div>

            <div class="form-group">
                <label for="signupPassword">Password</label>
                <div class="password-box">
                    <input type="password" id="signupPassword" name="password" placeholder="Create a password">
                    <button type="button" onclick="togglePassword('signupPassword')">Show</button>
                </div>
                <small id="signupPasswordError"></small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-box">
                    <input type="password" id="confirmPassword" placeholder="Confirm your password">
                    <button type="button" onclick="togglePassword('confirmPassword')">Show</button>
                </div>
                <small id="confirmPasswordError"></small>
            </div>

            <button type="submit" class="btn-primary">Sign Up</button>
        </form>

        <p class="bottom-text">
            Already have an account?
            <a th:href="@{/login}">Login</a>
        </p>
    </div>
</div>

<script th:src="@{/js/auth.js}"></script>
</body>
</html>
